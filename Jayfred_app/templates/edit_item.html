<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">Lost & Found Tracker</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm"><div class="card-body p-4">
        <h3 class="fw-bold mb-3">Edit Item</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Item Name</label>
                <input class="form-control" name="item_name" value="{{ item.item_name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <input class="form-control" name="category" value="{{ item.category }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="3">{{ item.description }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input class="form-control" name="location" value="{{ item.location }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="Lost" {% if item.status == "Lost" %}selected{% endif %}>Lost</option>
                    <option value="Found" {% if item.status == "Found" %}selected{% endif %}>Found</option>
                    <option value="Claimed" {% if item.status == "Claimed" %}selected{% endif %}>Claimed</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Contact Information</label>
                <input class="form-control" name="contact_information" value="{{ item.contact_information }}">
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div></div>
</div>
</body>
</html>
