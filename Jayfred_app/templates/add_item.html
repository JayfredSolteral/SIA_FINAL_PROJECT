<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Item - Lost & Found Tracker</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                Lost & Found Tracker
            </a>

        </div>
    </nav>


    <!-- Main Content -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center fw-bold mb-4">
                            Add Lost & Found Item
                        </h2>

                        <form method="post">

                            {% csrf_token %}

                            <!-- Item Name -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Item Name
                                </label>

                                <input type="text"
                                       name="item_name"
                                       class="form-control"
                                       placeholder="Example: Black Wallet"
                                       required>

                            </div>


                            <!-- Description -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Description
                                </label>

                                <textarea name="description"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Describe the item"></textarea>

                            </div>


                            <!-- Category -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Category
                                </label>

                                <input type="text"
                                       name="category"
                                       class="form-control"
                                       placeholder="Example: Wallet"
                                       required>

                            </div>


                            <!-- Location -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Location
                                </label>

                                <input type="text"
                                       name="location"
                                       class="form-control"
                                       placeholder="Example: School Library"
                                       required>

                            </div>


                            <!-- Status -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Status
                                </label>

                                <select name="status"
                                        class="form-select"
                                        required>

                                    <option value="Lost">
                                        Lost
                                    </option>

                                    <option value="Found">
                                        Found
                                    </option>

                                    <option value="Returned">
                                        Returned
                                    </option>

                                </select>

                            </div>


                            <!-- Contact Information -->
                            <div class="mb-4">

                                <label class="form-label">
                                    Contact Information
                                </label>

                                <input type="text"
                                       name="contact_information"
                                       class="form-control"
                                       placeholder="Example: 09XXXXXXXXX"
                                       required>

                            </div>


                            <!-- Buttons -->
                            <div class="d-flex gap-2">

                                <a href="{% url 'home' %}"
                                   class="btn btn-secondary w-50">
                                    Cancel
                                </a>

                                <button type="submit"
                                        class="btn btn-primary w-50">
                                    Save Item
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="bg-primary text-white text-center mt-5 py-3">

        <p class="mb-0">
            Lost & Found Tracker
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
